<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SongUp</title>
<link rel=stylesheet href=/style.css>
<main style="max-width:560px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px">
 <div class=card style="position:sticky;top:8px;z-index:1">
  <h3>Now playing <span id=sh class=pill style="display:none">🔀 Shuffle</span></h3>
  <b id=now style="font-size:1.15em">-</b><br><small id=left></small>
 </div>
 <div class=card>
  <h3>Add a song</h3>
  <input id=nick placeholder="Your name" maxlength=30 style="width:100%;margin-bottom:8px">
  <form id=sf style="display:flex;gap:8px"><input id=q placeholder="Search song or artist" style="flex:1;min-width:0"><button>Search</button></form>
  <p id=msg style="margin:6px 0 0"></p><ul id=res></ul>
 </div>
 <div class=card><h3>Up next</h3><ul id=queue></ul></div>
</main>
<script>
const code='__CODE__'
const uid=localStorage.uid||(localStorage.uid=crypto.randomUUID())
nick.value=localStorage.nick||'';nick.oninput=()=>localStorage.nick=nick.value
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const img=v=>'<img src="https://i.ytimg.com/vi/'+v+'/default.jpg" loading=lazy alt="">'
const dur=s=>s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):''
const render=s=>{
 now.textContent=s.current?s.current.title+' — '+s.current.artist:'Nothing playing yet'
 sh.style.display=s.shuffle?'inline-block':'none';sh.className='pill'+(s.shuffle?' on':'')
 const mine=s.queue.filter(x=>x.uid===uid).length
 left.textContent='You added '+mine+' of '+s.max+' songs in queue'
 queue.innerHTML=s.queue.map(x=>'<li>'+img(x.vid)+'<div class=t><b>'+esc(x.title)+'</b><small>'+esc(x.artist)+(x.nick?' · '+esc(x.nick):'')+'</small></div></li>').join('')||'<li><small>Queue is empty</small></li>'}
// polling, not SSE: cloudflare quick tunnels buffer event streams
const poll=()=>fetch('/api/state/'+code).then(r=>r.json()).then(render).catch(()=>{})
poll();setInterval(poll,2000)
let results=[]
sf.onsubmit=async e=>{e.preventDefault();msg.textContent='';res.innerHTML='<li><small>Searching...</small></li>'
 results=await(await fetch('/api/search?q='+encodeURIComponent(q.value))).json()
 res.innerHTML=results.map((x,i)=>'<li>'+img(x.videoId)+'<div class=t><b>'+esc(x.title)+'</b><small>'+esc(x.artist)+' · '+dur(x.duration)+'</small></div><button onclick="add('+i+')">Add</button></li>').join('')||'<li><small>No results</small></li>'}
async function add(i){const x=results[i]
 const r=await fetch('/api/add/'+code,{method:'POST',body:JSON.stringify({uid,nick:nick.value,vid:x.videoId,title:x.title,artist:x.artist})})
 const j=await r.json()
 if(r.ok){res.innerHTML='';q.value='';results=[];msg.textContent='✓ Added "'+x.title+'"';poll()}
 else msg.textContent=({SONG_LIMIT_REACHED:'Song limit reached',DUPLICATE_SONG:'Already in queue'}[j.error]||'Error')}
</script>
